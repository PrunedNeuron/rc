# ~/.config/kitty/floating.conf
# Optimized for Clipse + Hyprland v0.53

# ==========================================
# WINDOW & GEOMETRY
# ==========================================
remember_window_size no
# Dimensions here act as a fallback, but Hyprland windowrule takes precedence
initial_window_width 85c
initial_window_height 25c
window_padding_width 15
window_padding_height 15
hide_window_decorations yes
confirm_os_window_close 0

# ==========================================
# FONT (SF Mono for clean UI)
# ==========================================
font_family SF Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.5

# ==========================================
# CURSOR & MOUSE
# ==========================================
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
mouse_hide_wait 3.0

# ==========================================
# PERFORMANCE (144Hz)
# ==========================================
repaint_delay 6
input_delay 1
sync_to_monitor yes

# ==========================================
# AESTHETICS (Mica Compatibility)
# ==========================================
# 0.85 Opacity allows the Hyprland 'blur' and 'xray' to create the frosted effect
background_opacity 0.85
dynamic_background_opacity yes

# ==========================================
# COLORS (Material Light / Frost)
# ==========================================
foreground #2a2a2a
background #ffffff
selection_foreground #ffffff
selection_background #33ccff

# Subtle color palette for TUI tools
color0 #000000
color8 #444444
color1 #ff5555
color9 #ff5555
color2 #50fa7b
color10 #50fa7b
color3 #f1fa8c
color11 #f1fa8c
color4 #4c9ae5
color12 #4c9ae5
color5 #bd93f9
color13 #bd93f9
color6 #8be9fd
color14 #8be9fd
color7 #bfbfbf
color15 #e6e6e6

# ==========================================
# MISC
# ==========================================
enable_audio_bell no
visual_bell_duration 0.0
tab_bar_style hidden
