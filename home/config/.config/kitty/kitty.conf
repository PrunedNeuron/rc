# ══════════════════════════════════════════════════════════════════════════════
# kitty.conf
# CachyOS / Arch Linux · Hyprland · Wayland
#
# Target: kitty >= 0.48
#
# Design principles:
#   - Configure intentional deviations from kitty defaults.
#   - Preserve useful native shortcuts unless deliberately overridden.
#   - Prefer native kitty actions/features over shell workarounds.
#   - Keep security-sensitive capabilities explicitly constrained.
#   - Let kitty inherit upstream defaults where no customization is needed.
#
# Single-instance mode is a CLI feature, not a kitty.conf option:
#
#   kitty --single-instance --instance-group=main
#
# Useful built-ins:
#   Ctrl+Shift+F2  edit kitty.conf
#   Ctrl+Shift+F3  command palette
#   Ctrl+Shift+F5  reload kitty.conf
#   Ctrl+Shift+F6  inspect/debug effective configuration
#   Ctrl+Shift+F7  visually focus a kitty window
#   Ctrl+Shift+F8  visually swap a kitty window
#
# IMPORTANT:
# Comments must occupy their own lines. Do not append comments after values.
# ══════════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────────
# Integration and remote control
# ──────────────────────────────────────────────────────────────────────────────

# Permit remote control through kitty's socket only.
# TTY escape-sequence remote-control requests remain denied.
allow_remote_control socket-only

# Linux abstract UNIX socket.
# kitty automatically makes per-process socket addresses unique.
listen_on unix:@kitty

# Required for prompt navigation, command-output actions, cwd tracking,
# command-finish notifications, and other shell-aware functionality.
shell_integration enabled

# Arch/CachyOS package management owns kitty updates.
update_check_interval 0


# ──────────────────────────────────────────────────────────────────────────────
# Platform
# ──────────────────────────────────────────────────────────────────────────────

# This machine intentionally runs kitty through Wayland.
linux_display_server wayland

# Disable Wayland IME integration when East Asian/IME input is not required.
# Upstream notes that Wayland IME implementations can add input-loop latency.
wayland_enable_ime no


# ──────────────────────────────────────────────────────────────────────────────
# Fonts
# ──────────────────────────────────────────────────────────────────────────────

font_family      SF Mono Regular
bold_font        SF Mono Bold
italic_font      SF Mono Italic
bold_italic_font SF Mono Bold Italic

font_size 10.0

# Keep programming ligatures enabled.
disable_ligatures never

# Nerd Font symbols without requiring a patched primary font.
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F532,U+F0001-U+F1AF0 Symbols Nerd Font Mono


# ──────────────────────────────────────────────────────────────────────────────
# Cursor
# ──────────────────────────────────────────────────────────────────────────────

cursor_shape beam
cursor_shape_unfocused hollow

cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Cursor-trail trigger delay is expressed in milliseconds.
cursor_trail 1
cursor_trail_decay 0.4 0.8
cursor_trail_start_threshold 2


# ──────────────────────────────────────────────────────────────────────────────
# Scrollback and scrolling
# ──────────────────────────────────────────────────────────────────────────────

# Keep interactive scrollback reasonably bounded.
scrollback_lines 10000

# Maintain a much larger separate history for the scrollback pager.
# Unit: MB. This avoids making the live interactive history unnecessarily huge.
scrollback_pager_history_size 10

# Explicitly retain your faster-than-default touchpad scrolling preference.
touch_scroll_multiplier 3.0


# ──────────────────────────────────────────────────────────────────────────────
# Bell and notifications
# ──────────────────────────────────────────────────────────────────────────────

enable_audio_bell no
visual_bell_duration 0.0

# Notify only when the command's window is not actually visible.
# Less noisy than "unfocused" when another visible split has focus.
notify_on_cmd_finish invisible 10.0


# ──────────────────────────────────────────────────────────────────────────────
# Window appearance and behavior
# ──────────────────────────────────────────────────────────────────────────────

window_padding_width 8
window_border_width 1pt

# Hyprland owns outer window decoration.
hide_window_decorations yes

# Keep kitty's robust default child-exit semantics:
# the window remains alive while background/disowned processes still use its TTY.
close_on_child_death no

# Prompt only when closing would terminate at least one running command.
# Shells sitting idle at prompts are not counted.
confirm_os_window_close -1


# ──────────────────────────────────────────────────────────────────────────────
# Layouts
# ──────────────────────────────────────────────────────────────────────────────

# Start with splits while retaining all other kitty layouts.
enabled_layouts splits,*


# ──────────────────────────────────────────────────────────────────────────────
# Tab bar
# ──────────────────────────────────────────────────────────────────────────────

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round

# Keep the tab bar visible even with a single tab.
tab_bar_min_tabs 1

tab_activity_symbol "● "

# Preserve kitty's bell/activity/progress indicators while adding tab numbers.
# Tab numbers correspond directly to the goto_tab shortcuts below.
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{index}: {tab.last_focused_progress_percent}{title}"


# ──────────────────────────────────────────────────────────────────────────────
# Transparency
# ──────────────────────────────────────────────────────────────────────────────

background_opacity 1.0
background_blur 0

# Required for the dynamic-opacity mappings below.
dynamic_background_opacity yes


# ──────────────────────────────────────────────────────────────────────────────
# URLs and hyperlinks
# ──────────────────────────────────────────────────────────────────────────────

url_style straight
open_url_with default

detect_urls yes
allow_hyperlinks yes

# Current accepted values are never / always / ctrl / alt / shift / cmd.
show_hyperlink_targets always


# ──────────────────────────────────────────────────────────────────────────────
# Clipboard
# ──────────────────────────────────────────────────────────────────────────────

copy_on_select no

# Programs may write to the clipboard/primary selection.
# Reads require interactive permission.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask


# ──────────────────────────────────────────────────────────────────────────────
# Mouse
# ──────────────────────────────────────────────────────────────────────────────

mouse_hide_wait 3.0
focus_follows_mouse yes


# ──────────────────────────────────────────────────────────────────────────────
# Scrollbar
# ──────────────────────────────────────────────────────────────────────────────

# Appear once the terminal has been scrolled backwards.
scrollbar scrolled

scrollbar_width 0.3
scrollbar_hover_width 0.6
scrollbar_gap 0.75


# ══════════════════════════════════════════════════════════════════════════════
# Keyboard
#
# kitty_mod expands to Ctrl+Shift.
#
# Keep kitty's native mappings unless explicitly overridden below.
# This means newly introduced useful upstream shortcuts can continue to appear
# automatically instead of requiring this file to duplicate the entire default
# key map.
# ══════════════════════════════════════════════════════════════════════════════

kitty_mod ctrl+shift

# Cancel unfinished multi-key mappings after two seconds.
map_timeout 2.0


# ── Shell compatibility ───────────────────────────────────────────────────────

# Preserve traditional ^H for Ctrl+Backspace.
map ctrl+backspace send_text all \x08


# ── New windows ───────────────────────────────────────────────────────────────

# Override kitty's ordinary new-window actions so new shells inherit cwd.
map kitty_mod+enter new_window_with_cwd
map kitty_mod+n     new_os_window_with_cwd


# ── Splits ────────────────────────────────────────────────────────────────────

map kitty_mod+backslash     launch --location=vsplit --cwd=current
map kitty_mod+alt+backslash launch --location=hsplit --cwd=current

# Intentionally replaces kitty's default interactive resize-mode binding.
map kitty_mod+r layout_action rotate


# ── Window focus ──────────────────────────────────────────────────────────────

# Vim-style directional focus.
# These intentionally replace kitty's default Ctrl+Shift+J/K scroll-line
# shortcuts where applicable.
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right

# Visual focus picker.
# Intentionally replaces move_window_forward on Ctrl+Shift+F.
map kitty_mod+f focus_visible_window


# ── Window movement ───────────────────────────────────────────────────────────

map kitty_mod+alt+h move_window left
map kitty_mod+alt+j move_window down
map kitty_mod+alt+k move_window up
map kitty_mod+alt+l move_window right


# ── Window resizing ───────────────────────────────────────────────────────────

map kitty_mod+alt+left  resize_window narrower 3
map kitty_mod+alt+right resize_window wider 3
map kitty_mod+alt+up    resize_window taller 3
map kitty_mod+alt+down  resize_window shorter 3
map kitty_mod+alt+home  resize_window reset


# ── Font size ─────────────────────────────────────────────────────────────────

# Use finer 1-point steps instead of kitty's default 2-point steps.
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0

# Additional intuitive reset alias.
map kitty_mod+0 change_font_size all 0


# ── Tabs ──────────────────────────────────────────────────────────────────────

# New tab inherits cwd.
map kitty_mod+t new_tab_with_cwd

# Repurpose punctuation for tab navigation.
# Alt variants retain tab reordering.
map kitty_mod+.         next_tab
map kitty_mod+comma     previous_tab
map kitty_mod+alt+.     move_tab_forward
map kitty_mod+alt+comma move_tab_backward

# Direct tab selection.
# These intentionally replace kitty's numbered-window mappings.
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9


# ── Layout switching ──────────────────────────────────────────────────────────

# Ctrl+Shift+S normally pastes the primary selection; intentionally repurposed.
map kitty_mod+s toggle_layout splits

map kitty_mod+alt+z toggle_layout stack
map kitty_mod+alt+g toggle_layout grid
map kitty_mod+alt+f goto_layout fat
map kitty_mod+alt+v goto_layout tall


# ── Hints ─────────────────────────────────────────────────────────────────────

# Ctrl+Shift+E remains kitty's native URL-hints action.
#
# These add convenient direct hint actions that copy the selected result.
# Ctrl+Shift+O intentionally replaces pass_selection_to_program.
map kitty_mod+o     kitten hints --type path       --program @
map kitty_mod+y     kitten hints --type hash       --program @
map kitty_mod+i     kitten hints --type ip_address --program @
map kitty_mod+alt+w kitten hints --type word       --program @

# Do NOT map kitty_mod+alt+l here: it is already used for move_window right.
# Kitty's native hint leader already provides line selection at:
#   Ctrl+Shift+P > L


# ── Background opacity ────────────────────────────────────────────────────────

# These are native kitty actions, changed only to use finer 0.05 steps.
map kitty_mod+a>m set_background_opacity +0.05
map kitty_mod+a>l set_background_opacity -0.05
map kitty_mod+a>1 set_background_opacity 1.0
map kitty_mod+a>d set_background_opacity default


# ── Terminal clearing ─────────────────────────────────────────────────────────

# Clear through the current shell prompt without resetting terminal state.
map kitty_mod+alt+delete clear_terminal to_cursor active


# ── Theme switcher ────────────────────────────────────────────────────────────

# Ctrl+Shift+F3 is deliberately preserved for kitty's Command Palette.
map kitty_mod+alt+f3 launch --type=overlay kitty +kitten themes


# ══════════════════════════════════════════════════════════════════════════════
# Theme
# ══════════════════════════════════════════════════════════════════════════════

# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME
