# ══════════════════════════════════════════════════════════════════════════════
# open-actions.conf
# ══════════════════════════════════════════════════════════════════════════════

# Shell scripts — run with shebang interpreter
protocol file
ext sh,command,tool,run
action launch --hold --type=os-window kitten __shebang__ confirm-always $FILE_PATH $SHELL

protocol file
ext fish,bash,zsh
action launch --hold --type=os-window kitten __shebang__ confirm-always $FILE_PATH __ext__

# Executables
protocol file
mime inode/executable,application/vnd.microsoft.portable-executable
action launch --hold --type=os-window -- kitten __confirm_and_run_exe__ $FILE_PATH

# Source code and plain text — open in $EDITOR
protocol file
ext py,lua,rs,go,ts,js,jsx,tsx,c,cpp,h,hpp,java,rb,php,swift,kt,cs,zig,nix,toml,yaml,yml,json,jsonc,xml,html,htm,css,scss,sass,less,md,mdx,rst,tex,sql,vim,conf,cfg,ini,env
action launch --type=os-window -- $EDITOR -- $FILE_PATH

protocol file
mime text/*
action launch --type=os-window -- $EDITOR -- $FILE_PATH

# Images — icat inline viewer (overlay keeps terminal context)
protocol file
mime image/*
action launch --type=overlay kitten icat --hold -- $FILE_PATH

# PDF
protocol file
mime application/pdf
action launch --type=os-window -- zathura -- $FILE_PATH

# Video / audio
protocol file
mime video/*
action launch --type=background -- mpv -- $FILE_PATH

protocol file
mime audio/*
action launch --type=background -- mpv --no-video -- $FILE_PATH

# Archives — open containing directory
protocol file
mime application/zip,application/x-tar,application/x-gzip,application/x-bzip2,application/x-xz,application/x-zstd,application/x-7z-compressed,application/x-rar
action launch --type=os-window -- $SHELL -c 'cd "$(dirname "$1")" && $SHELL' -- $FILE_PATH

# Directories — cd into them
protocol file
mime inode/directory
action send_text normal,application \x15cd "${FILE_PATH}" && ls\r

# SSH URLs — use kitty's SSH kitten for full feature support
protocol ssh
action launch --type=os-window -- kitten ssh $URL

# mailto
protocol mailto
action launch --type=background -- xdg-open $URL

# HTTP/HTTPS
protocol http
action launch --type=background -- xdg-open $URL

protocol https
action launch --type=background -- xdg-open $URL
