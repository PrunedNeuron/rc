# ~/.config/hypr/conf.d/windows.conf
# Hyprland v0.53 - Comprehensive Window Rules

# ============================================================================
# GLOBAL POLICIES
# ============================================================================

windowrule {
    name = global_suppress_maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = xwayland_helper_suppress
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    no_focus = on
}

# ============================================================================
# OPACITY HIERARCHY (Frosted Glass Aesthetic)
# ============================================================================

# Web Browsers
windowrule {
    name = opacity_browsers
    match:class = ^(firefox-nightly|firefox|Google-chrome|Chromium|Thorium-browser|Brave-browser|zen-browser|Arc|librewolf|Vivaldi)$
    opacity = 0.98 0.94
}

# Code Editors & IDEs
windowrule {
    name = opacity_editors
    match:class = ^(Code|code-oss|VSCodium|zed|dev\.zed\.Zed|cursor|neovide|lapce|sublime_text)$
    opacity = 0.97 0.93
}

# Terminals
windowrule {
    name = opacity_terminals
    match:class = ^(kitty|foot|Alacritty|konsole|wezterm|st|urxvt|terminator|tilix)$
    opacity = 0.95 0.90
}

# File Managers
windowrule {
    name = opacity_filemanagers
    match:class = ^(org\.kde\.dolphin|org\.gnome\.Nautilus|thunar|Thunar|pcmanfm|nemo|caja)$
    opacity = 0.96 0.92
}

# Note-Taking Apps
windowrule {
    name = opacity_notes
    match:class = ^(obsidian|Joplin|Notion|notion|Standard Notes|logseq|Typora|Mark Text|marktext)$
    opacity = 0.97 0.93
}

# KDE Applications
windowrule {
    name = opacity_kde_apps
    match:class = ^(org\.kde\.kate|org\.kde\.kwrite|org\.kde\.okular|org\.kde\.ark|org\.kde\.spectacle)$
    opacity = 0.96 0.92
}

# System Utilities
windowrule {
    name = opacity_utilities
    match:class = ^(pavucontrol|blueman-manager|nm-applet|nm-connection-editor|system-config-printer)$
    opacity = 0.93 0.88
}

# Settings & Configuration
windowrule {
    name = opacity_settings
    match:class = ^(qt5ct|qt6ct|kvantummanager|nwg-look|lxappearance|hyprland-share-picker|systemsettings)$
    opacity = 0.95 0.90
}

# Password Managers (Full opacity for security)
windowrule {
    name = opacity_password_managers
    match:class = ^(1Password|Bitwarden|KeePassXC|org\.keepassxc\.KeePassXC)$
    opacity = 1.0 override
    no_blur = on
}

# Media Players
windowrule {
    name = opacity_media
    match:class = ^(Spotify|spotify|mpv|vlc|celluloid|rhythmbox|clementine|elisa)$
    opacity = 0.96 0.92
}

# Communication Apps
windowrule {
    name = opacity_communication
    match:class = ^(discord|Discord|vesktop|Slack|slack|teams-for-linux|zoom|Element|telegram-desktop|thunderbird)$
    opacity = 0.96 0.92
}

# Email Clients
windowrule {
    name = opacity_email
    match:class = ^(thunderbird|org\.kde\.kmail|geary|evolution)$
    opacity = 0.96 0.92
}

# ============================================================================
# FLOATING UTILITIES (Smart Positioning)
# ============================================================================

# System Utilities
windowrule {
    name = float_system_utils
    match:class = ^(pavucontrol|blueman-manager|nm-applet|nm-connection-editor|system-config-printer)$
    float = on
    center = on
    size = 720 580
}

# Qt/GTK Configuration Tools
windowrule {
    name = float_config_tools
    match:class = ^(qt5ct|qt6ct|kvantummanager|nwg-look|lxappearance)$
    float = on
    center = on
    size = 900 650
}

# Polkit Authentication (Critical Security)
windowrule {
    name = float_polkit_auth
    match:class = ^(org\.kde\.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1)$
    float = on
    center = on
    size = 450 200
    stay_focused = on
    pin = on
}

# File Picker Dialogs
windowrule {
    name = float_file_pickers
    match:title = ^(Open File|Open Folder|Save File|Save As|Select|Library|File Upload|Choose|Browse)$
    float = on
    center = on
    size = 900 600
}

# XDG Desktop Portals
windowrule {
    name = float_portals
    match:class = ^(org\.freedesktop\.impl\.portal\.desktop\.|xdg-desktop-portal-gtk|xdg-desktop-portal-kde)$
    float = on
    center = on
    size = 950 650
}

# Calculator
windowrule {
    name = float_calculator
    match:class = ^(org\.gnome\.Calculator|qalculate-gtk|Qalculate-gtk|galculator|gnome-calculator|kcalc)$
    float = on
    center = on
    size = 400 600
}

# Color Picker
windowrule {
    name = float_color_picker
    match:class = ^(gcolor3|gpick|kcolorchooser)$
    float = on
    center = on
    size = 400 500
}

# Archive Managers
windowrule {
    name = float_archive_tools
    match:class = ^(org\.kde\.ark|file-roller|xarchiver)$
    match:title = ^(Extract|Compress|Archive)$
    float = on
    center = on
    size = 700 500
}

# Password Manager Quick Access
windowrule {
    name = float_password_quick
    match:title = ^(1Password|Bitwarden - .*|KeePassXC - Browser)$
    float = on
    center = on
    size = 450 650
}

# Image Viewers
windowrule {
    name = float_image_viewers
    match:class = ^(com\.interversehq\.qView|qView|imv|org\.kde\.gwenview|eog|feh|sxiv|nsxiv|viewnior)$
    float = on
    center = on
}

# ============================================================================
# CLIPSE (Clipboard Manager)
# ============================================================================

windowrule {
    name = clipse_clipboard
    match:class = ^(floating)$
    match:title = ^(clipse)$
    float = on
    center = on
    size = 700 750
    stay_focused = on
    dim_around = on
    border_color = rgba(88C0D0ff)
    opacity = 0.95 override
}

# ============================================================================
# APPLICATION LAUNCHERS
# ============================================================================

# Vicinae / Walker
windowrule {
    name = launcher_vicinae_walker
    match:class = ^(walker|vicinae)$
    float = on
    center = on
    stay_focused = on
    dim_around = on
    animation = popin 88%
    opacity = 0.95 override
}

# Fuzzel
windowrule {
    name = launcher_fuzzel
    match:class = ^(fuzzel)$
    stay_focused = on
    no_shadow = on
}

# Rofi
windowrule {
    name = launcher_rofi
    match:class = ^(Rofi)$
    float = on
    stay_focused = on
    dim_around = on
    opacity = 0.95 override
}

# Wofi
windowrule {
    name = launcher_wofi
    match:class = ^(wofi)$
    float = on
    stay_focused = on
}

# ============================================================================
# NOTIFICATIONS (SwayNC / Mako)
# ============================================================================

windowrule {
    name = swaync_control_center
    match:class = ^(swaync-control-center)$
    float = on
    size = 500 95%
    move = 100%-510 10
    animation = slideRight
    opacity = 0.96 override
}

windowrule {
    name = swaync_notification_toast
    match:class = ^(swaync-notification-window)$
    no_focus = on
    no_follow_mouse = on
}

# ============================================================================
# STATUS BARS (HyprPanel / Quickshell)
# ============================================================================

windowrule {
    name = quickshell_bar
    match:class = ^(org\.quickshell)$
    float = on
}

windowrule {
    name = ags_widgets
    match:class = ^(com\.github\.Aylur\.ags)$
    float = on
}

# ============================================================================
# GAMING OPTIMIZATION (Zero-Latency)
# ============================================================================

# Competitive FPS Games
windowrule {
    name = gaming_competitive
    match:title = ^(Counter-Strike 2|cs2|Dota 2|dota2|Overwatch 2|Apex Legends|VALORANT|valorant|Rainbow Six Siege|Call of Duty|Fortnite)$
    immediate = on
    idle_inhibit = always
    no_blur = on
    no_shadow = on
    opacity = 1.0 override
}

# Steam Games
windowrule {
    name = gaming_steam
    match:class = ^(steam_app_)
    no_blur = on
    idle_inhibit = always
    opacity = 1.0 override
}

# Steam Notifications (Suppress Focus)
windowrule {
    name = steam_notifications
    match:class = ^(steam)$
    match:title = ^(notificationtoasts_|Steam - Self Updater)$
    no_focus = on
    no_follow_mouse = on
}

# Lutris
windowrule {
    name = gaming_lutris
    match:class = ^(lutris)$
    idle_inhibit = focus
}

# Heroic Games Launcher
windowrule {
    name = gaming_heroic
    match:class = ^(heroic)$
    idle_inhibit = focus
}

# Bottles
windowrule {
    name = gaming_bottles
    match:class = ^(com\.usebottles\.bottles)$
    idle_inhibit = focus
}

# ============================================================================
# PICTURE-IN-PICTURE (Enhanced)
# ============================================================================

windowrule {
    name = pip_video
    match:title = ^(Picture-in-Picture|Picture in picture|PiP|pip)$
    float = on
    pin = on
    border_size = 0
    keep_aspect_ratio = on
    size = 560 315
    move = 100%-570 100%-325
    opacity = 1.0 override
    no_shadow = on
}

# Browser PiP Detection
windowrule {
    name = pip_browser_detect
    match:title = ^(.*- Picture in Picture)$
    float = on
    pin = on
    keep_aspect_ratio = on
    border_size = 0
}

# ============================================================================
# SCREENSHOT TOOLS
# ============================================================================

# Flameshot
windowrule {
    name = screenshot_flameshot
    match:class = ^(flameshot)$
    float = on
    no_anim = on
    no_initial_focus = on
    stay_focused = on
    monitor = eDP-1
    move = 0 0
    pin = on
    rounding = 0
    no_shadow = on
    opacity = 1.0 override
}

# Spectacle (KDE)
windowrule {
    name = screenshot_spectacle
    match:class = ^(org\.kde\.spectacle)$
    float = on
    no_anim = on
}

# ============================================================================
# JETBRAINS IDEs (Comprehensive)
# ============================================================================

# IDE Splash Screens
windowrule {
    name = jetbrains_splash
    match:class = ^(jetbrains-.*)$
    match:title = ^(Welcome to .*)$
    float = on
    center = on
}

# Helper Windows
windowrule {
    name = jetbrains_helpers
    match:class = ^(jetbrains-.*)$
    match:title = ^(win.*)$
    no_focus = on
    no_shadow = on
}

# Main IDE Windows
windowrule {
    name = jetbrains_main
    match:class = ^(jetbrains-.*)$
    idle_inhibit = focus
    opacity = 0.97 0.93
}

# ============================================================================
# CREATIVE APPLICATIONS (Full Opacity)
# ============================================================================

# OBS Studio
windowrule {
    name = creative_obs
    match:class = ^(com\.obsproject\.Studio)$
    idle_inhibit = always
    opacity = 1.0 override
    no_blur = on
}

# GIMP
windowrule {
    name = creative_gimp
    match:class = ^(Gimp|gimp)$
    opacity = 1.0 override
    no_blur = on
}

# Krita
windowrule {
    name = creative_krita
    match:class = ^(krita)$
    opacity = 1.0 override
    no_blur = on
}

# Blender
windowrule {
    name = creative_blender
    match:class = ^(Blender|blender)$
    opacity = 1.0 override
    idle_inhibit = focus
    no_blur = on
}

# Inkscape
windowrule {
    name = creative_inkscape
    match:class = ^(org\.inkscape\.Inkscape)$
    opacity = 1.0 override
    no_blur = on
}

# Kdenlive
windowrule {
    name = creative_kdenlive
    match:class = ^(org\.kde\.kdenlive)$
    opacity = 1.0 override
    idle_inhibit = focus
    no_blur = on
}

# DaVinci Resolve
windowrule {
    name = creative_resolve
    match:class = ^(DaVinciResolve|resolve)$
    opacity = 1.0 override
    immediate = on
    idle_inhibit = always
    no_blur = on
}

# Audacity
windowrule {
    name = creative_audacity
    match:class = ^(audacity)$
    opacity = 1.0 override
}

# ============================================================================
# SYSTEM MONITORS (Floating)
# ============================================================================

windowrule {
    name = float_system_monitors
    match:title = ^(htop|btop|nvtop|gotop|bashtop|bottom)$
    float = on
    size = 1100 700
    center = on
}

windowrule {
    name = float_mission_center
    match:class = ^(io\.missioncenter\.MissionCenter)$
    float = on
    size = 1200 800
    center = on
}

# ============================================================================
# VIRTUAL MACHINES (Performance Critical)
# ============================================================================

# Virt-Manager
windowrule {
    name = vm_virt_manager
    match:class = ^(virt-manager|Virt-manager)$
    opacity = 1.0 override
    idle_inhibit = focus
    no_blur = on
}

# Looking Glass
windowrule {
    name = vm_looking_glass
    match:class = ^(looking-glass-client)$
    immediate = on
    idle_inhibit = always
    opacity = 1.0 override
    no_blur = on
}

# GNOME Boxes
windowrule {
    name = vm_boxes
    match:class = ^(org\.gnome\.Boxes)$
    opacity = 1.0 override
    idle_inhibit = focus
}

# VirtualBox
windowrule {
    name = vm_virtualbox
    match:class = ^(VirtualBox Manager|VirtualBox Machine)$
    opacity = 1.0 override
    idle_inhibit = focus
}

# ============================================================================
# DEVELOPMENT TOOLS
# ============================================================================

# Postman
windowrule {
    name = dev_postman
    match:class = ^(Postman)$
    opacity = 0.97 0.93
}

# DBeaver
windowrule {
    name = dev_dbeaver
    match:class = ^(DBeaver)$
    opacity = 0.97 0.93
}

# Bruno
windowrule {
    name = dev_bruno
    match:class = ^(bruno)$
    opacity = 0.97 0.93
}

# Insomnia
windowrule {
    name = dev_insomnia
    match:class = ^(Insomnia)$
    opacity = 0.97 0.93
}

# Beekeeper Studio
windowrule {
    name = dev_beekeeper
    match:class = ^(beekeeper-studio)$
    opacity = 0.97 0.93
}

# ============================================================================
# BROWSER ENHANCEMENTS
# ============================================================================

# Developer Tools
windowrule {
    name = browser_devtools
    match:title = ^(.*DevTools.*)$
    opacity = 0.98 0.94
}

# ============================================================================
# MODAL DIALOGS
# ============================================================================

windowrule {
    name = modal_dialogs
    match:modal = true
    float = on
    center = on
}

# ============================================================================
# PREFERENCE WINDOWS
# ============================================================================

windowrule {
    name = preference_windows
    match:title = ^(Preferences|Settings|Options|Configuration|Properties)$
    float = on
    center = on
    size = 800 650
}

# ============================================================================
# XORG COMPATIBILITY
# ============================================================================

# Splash Screens
windowrule {
    name = xorg_splash
    match:xwayland = true
    match:title = ^(splash|Splash)$
    float = on
    center = on
}

# Utility Windows
windowrule {
    name = xorg_utility
    match:xwayland = true
    match:float = true
    match:title = ^(About|Preferences|Settings)$
    center = on
}

# ============================================================================
# MULTIMEDIA CONTENT DETECTION
# ============================================================================

# Fullscreen Video
windowrule {
    name = multimedia_video_fullscreen
    match:content = 2
    match:fullscreen = true
    immediate = on
    idle_inhibit = always
}

# Game Content
windowrule {
    name = multimedia_game
    match:content = 3
    immediate = on
    idle_inhibit = always
}

# ============================================================================
# TILING EXCEPTIONS
# ============================================================================

# Dropdown Terminal
windowrule {
    name = dropdown_terminal
    match:class = ^(dropdown)$
    float = on
    size = 85% 65%
    move = 7.5% 5%
    animation = slidevert
    opacity = 0.95 override
}

# Floating Class Marker
windowrule {
    name = floating_marker
    match:class = ^(floating)$
    float = on
}

# Wine Compatibility
windowrule {
    name = wine_compat
    match:class = ^(wine)$
    match:title = ^$
    no_focus = on
    no_shadow = on
}

# ============================================================================
# ADDITIONAL APPLICATIONS
# ============================================================================

# Transmission (BitTorrent)
windowrule {
    name = app_transmission
    match:class = ^(transmission-gtk|transmission-qt)$
    opacity = 0.96 0.92
}

# KTorrent
windowrule {
    name = app_ktorrent
    match:class = ^(org\.kde\.ktorrent)$
    opacity = 0.96 0.92
}

# Calibre
windowrule {
    name = app_calibre
    match:class = ^(calibre)$
    opacity = 0.97 0.93
}

# QGIS
windowrule {
    name = app_qgis
    match:class = ^(qgis)$
    opacity = 1.0 override
    no_blur = on
}

# FreeCAD
windowrule {
    name = app_freecad
    match:class = ^(FreeCAD)$
    opacity = 1.0 override
    no_blur = on
}


### GTK Context Menus
windowrule {
    name = gtk_layer_shell
    match:namespace = ^(gtk-layer-shell)$
    opacity = 0.95 0.85
}
