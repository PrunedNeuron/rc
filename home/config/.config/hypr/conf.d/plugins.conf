# ~/.config/hypr/conf.d/plugins.conf
# Version: 2026 State-of-the-Art (v0.53.0+)
# Strategy: Optimized physics, enhanced visual feedback, and zero-fringe rendering.

# ============================================================================
# HYPREXPO - Workspace Grid
# ============================================================================
# Official plugin for a birds-eye view of all workspaces.
plugin {
    hyprexpo {
        columns = 3
        gap_size = 10              # Increased for a more "airy" modern feel
        bg_col = rgba(f5f5f5FF)    # Full opacity white-smoke (matches light theme)
        workspace_method = center current

        # Gesture logic (Optimized for Laptop touchpads)
        enable_gesture = true
        gesture_distance = 350     # Tuned for more responsive activation
        gesture_positive = true    # Swipe up to enter expo
    }
}

# ============================================================================
# HYPRSPACE (Hypr-Overview) - Window Overview
# ============================================================================
# Modern GNOME-style window management overview.
plugin {
    overview {
        # Layout & Geometry
        panelHeight = 180
        onBottom = false
        workspaceMargin = 12
        workspaceBorderSize = 2

        # Style (Frosted glass strategy)
        drawBackdrop = true
        activeWorkspaceBorderColor = rgba(33ccffee) # Matches your active border

        # Behavior
        exitOnClick = true
        exitOnSwitch = true
        autoDrag = true            # Allows moving windows between WS in overview
        autoScroll = true          # Smooth mouse-wheel scrolling

        # v0.53 specific: ensure overview doesn't flicker on hybrid graphics
        affectStrut = false
    }
}

# ============================================================================
# DYNAMIC-CURSORS - Realistic Cursor Physics
# ============================================================================
# High-performance physics engine for the cursor.
plugin {
    dynamic-cursors {
        enabled = true
        mode = stretch             # Options: none, stretch, tilt, rotate

        # Stretch mode optimization for 144Hz
        stretch {
            limit = 3000           # Max stretch reached at 3000px/s
            function = quadratic   # Smooth non-linear acceleration
        }

        # Shake-to-find (High-DPI optimized)
        # Perfect for finding the cursor quickly on a 17" laptop screen.
        shake {
            enabled = false
            threshold = 5.0        # Sensitivity (higher = harder shake required)
            base = 1.0             # Normal size
            limit = 2.5            # Max magnification
            speed = 4.0            # Grow speed
            timeout = 1000         # Shrink back after 1 second
            effects = true         # Use cool transparency effects while shaking
        }
    }
}

# ============================================================================
# HYPRTRAILS - Motion Trails
# ============================================================================
# Smooth particle-like trails behind windows.
plugin {
    hyprtrails {
        enabled = false
        color = rgba(33ccffee)     # Vibrant blue trail to match border
        bezier_step = 0.025        # High-precision curve calculation
        points_per_step = 2        # Dense particles for 144Hz smoothness
        history_points = 18        # Length of the trail
        history_step = 2           # Skip distance between points
    }
}

# ============================================================================
# BORDERS++ (Optional Aesthetic Upgrade)
# ============================================================================
# Adds an additional subtle outer ring to windows for extra depth.
plugin {
    borders-plus-plus {
        add_borders = 1            # Single outer border
        col.border_1 = rgba(00000015) # Barely visible dark ring for separation
        border_size_1 = 1
    }
}

# ============================================================================
# MISC UTILITIES
# ============================================================================
# Darkwindow: Specific shaders for eye-strain reduction
plugin:darkwindow:load_shaders = invert,tint

# Ensure hyprpm knows how to handle these on reload
# exec-once = hyprpm reload -n
