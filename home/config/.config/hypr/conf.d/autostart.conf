# ~/.config/hypr/conf.d/autostart.conf

# ============================================================================
# SYSTEMD SESSION INITIALIZATION
# ============================================================================
# Export all environment to systemd (critical without uwsm, redundant with uwsm)

exec-once = dbus-update-activation-environment --systemd --all

# Activate compositor-specific services (noctalia.service, etc.)
exec-once = systemctl --user start hyprland-session.target

# Finalize uwsm session management (no-op without uwsm)
exec-once = uwsm finalize

# Re-export critical compositor variables (defensive redundancy)
exec-once = dbus-update-activation-environment --systemd FREETYPE_PROPERTIES QT_FONT_DPI FONTCONFIG_PATH CAIRO_FONT_OPTIONS WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# ============================================================================
# NVIDIA POWER MANAGEMENT
# ============================================================================
exec-once = nvidia-smi -pm 1
# exec-once = powerprofilesctl set power-saver


# ============================================================================
# SECURITY & AUTHENTICATION
# ============================================================================
exec-once = /usr/lib/pam_kwallet_init
exec-once = uwsm app -- kwalletd6
exec-once = systemctl --user start hyprpolkitagent.service

# ============================================================================
# DESKTOP AESTHETICS
# ============================================================================
# Noctalia managed by systemd (auto-restart enabled)
# Remove 'uwsm app --' prefix if not using uwsm

exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- swaync

# Load Hyprland plugins with --notify flag for status feedback
exec-once = hyprpm reload -n

# ============================================================================
# CLIPBOARD MANAGEMENT
# ============================================================================
exec-once = uwsm app -- clipse -listen
exec-once = uwsm app -- wl-clip-persist --clipboard both

# ============================================================================
# SYSTEM SERVICES
# ============================================================================
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- vicinae server
exec-once = uwsm app -- kdeconnectd

# NetworkManager applet with indicator support
# exec-once = uwsm app -- nm-applet --indicator

# Hyprsunset: Dynamic blue light filter (color temperature adjustment)
# exec-once = uwsm app -- hyprsunset
# exec-once = uwsm app -- sunsetr

# ============================================================================
# XDG DESKTOP PORTAL
# ============================================================================
exec-once = systemctl --user restart xdg-desktop-portal-hyprland.service xdg-desktop-portal.service

