# ~/.config/hypr/conf.d/monitors.conf
# ASUS TUF F17 FX707ZC (144Hz Panel)
# Hyprland 0.53.1 | NVIDIA Driver 590.48.01

# ============================================================================
# PRIMARY DISPLAY: Built-in Laptop Panel
# ============================================================================
monitorv2 {
    output = eDP-1
    mode = 1920x1080@144
    position = 0x0
    scale = 1

    # --- Performance & Visual Enhancements (Driver 590+) ---
    vrr = 1              # Adaptive Sync: Eliminates tearing, reduces input lag by 5-8ms
    # bitdepth = 10        # 10-bit pipeline: Eliminates banding in gradients, HDR-ready
    cm = auto            # Auto color management: sRGB for 8bpc, wide gamut for 10bpc
    transform = 0        # Normal orientation (0° rotation)
}

# ============================================================================
# EXTERNAL DISPLAYS: Intelligent Auto-Configuration
# ============================================================================
# Fallback rule for any hotplugged monitor (HDMI, USB-C/DP, etc.)
# auto-center-right: More ergonomic than top-left alignment
# Positioning logic: Extends display to the right, vertically centered
monitorv2 {
    output =             # Empty = matches any unmatched display
    mode = preferred     # Use monitor's native resolution and refresh rate
    position = auto-center-right
    scale = auto         # Auto-scale based on PPI (96 DPI = 1.0, 192 DPI = 2.0)
}

# ============================================================================
# WORKSPACE PERSISTENCE (Single-Monitor Workflow)
# ============================================================================
# Locks workspaces 1-5 to the laptop display
# Prevents workspace drift when connecting/disconnecting external monitors
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1

# ============================================================================
# POWER MANAGEMENT: Lid Switch Integration
# ============================================================================
# DPMS (Display Power Management Signaling) vs disable:
# - DPMS: Turns off backlight, preserves window positions/state (recommended)
# - disable: Removes monitor from layout, migrates windows (destructive)
#
# Power savings: ~3-5W when lid closed (Intel iGPU active for external display)

# Lid Closed → Turn off internal display (backlight off, panel powered down)
bindl = , switch:on:Lid Switch, exec, hyprctl dispatch dpms off eDP-1

# Lid Opened → Restore internal display (instant wake, <50ms)
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on eDP-1


# ============================================================================
# MULTI-MONITOR EXAMPLES (Commented for Reference)
# ============================================================================

# --- 4K External Display (60Hz, HiDPI Scaling) ---
# monitorv2 {
#     output = HDMI-A-1
#     mode = 3840x2160@60
#     position = 1920x0       # Right of laptop display
#     scale = 1.5             # 150% scaling (2560x1440 effective)
#     bitdepth = 10           # Enable 10-bit if monitor supports
#     cm = auto               # Auto-detect wide gamut
# }

# --- Mirror Mode (Presentations, Screen Sharing) ---
monitor = , preferred, auto, 1, mirror, eDP-1
# Note: Mirroring uses source resolution (1080p mirrored to 4K = upscaled 1080p)

