#     transform = 1           # 90° clockwise rotation
# }

# ============================================================================
# TROUBLESHOOTING COMMANDS
# ============================================================================
# List all connected displays:
#   hyprctl monitors all
#
# Check current refresh rate:
#   hyprctl monitors
#
# Force display wake (if stuck):
#   hyprctl dispatch dpms on eDP-1
#
# Verify VRR status:
#   hyprctl monitors | grep vrr
#
# Test 10-bit output (requires 10-bit content):
#   mpv --vo=gpu --gpu-api=vulkan <10bit_video.mkv>

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================
# VRR (Adaptive Sync):
#   - Latency reduction: 5.5ms @ 144Hz (1 frame) vs fixed vsync
#   - Eliminates tearing without input lag penalty
#   - Power savings: ~1-2W in variable workloads (e.g., scrolling, video)
#
# 10-bit Color:
#   - Memory bandwidth: +25% vs 8-bit (1.92 GB/s vs 1.54 GB/s @ 1080p144)
#   - VRAM usage: +25% for framebuffers (~8MB vs ~6MB per buffer)
#   - Trade-off: Eliminates banding artifacts (worth the cost)
#
# DPMS vs Disable:
#   - DPMS wake: <50ms (backlight power-on)
#   - Disable wake: 200-500ms (monitor re-detection, window re-layout)
#   - Power: Both save ~3-5W, but DPMS preserves state
