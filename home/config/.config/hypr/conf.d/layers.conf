# ~/.config/hypr/conf.d/layers.conf
# Hyprland v0.53 - Comprehensive Layer Rules

# ============================================================================
# APPLICATION LAUNCHERS (Mica/Acrylic Effect)
# ============================================================================

# Vicinae / Walker (Primary Launcher)
layerrule {
    name = launcher_vicinae_walker_mica
    match:namespace = ^(vicinae|walker)$
    blur = on
    ignore_alpha = 0#0.4
    xray = off
}

# Fuzzel
layerrule {
    name = launcher_fuzzel
    match:namespace = ^(fuzzel)$
    blur = on
    ignore_alpha = 0.4
    xray = on
}

# Wofi
layerrule {
    name = launcher_wofi
    match:namespace = ^(wofi)$
    blur = on
    ignore_alpha = 0.4
    xray = on
}

# AnyRun
layerrule {
    name = launcher_anyrun
    match:namespace = ^(anyrun)$
    blur = on
    ignore_alpha = 0.3
    xray = on
}

# Rofi
layerrule {
    name = launcher_rofi
    match:namespace = ^(rofi)$
    blur = on
    ignore_alpha = 0.4
    xray = on
}

# ============================================================================
# NOTIFICATIONS (SwayNC / Mako / Dunst)
# ============================================================================

# SwayNC Control Center
layerrule {
    name = notifications_swaync_center
    match:namespace = ^(swaync-control-center)$
    blur = on
    ignore_alpha = 0.4
    xray = on
}

# SwayNC Notification Toasts
layerrule {
    name = notifications_swaync_toasts
    match:namespace = ^(swaync-notification-window)$
    blur = on
    ignore_alpha = 0.5
}

# Mako Notifications
layerrule {
    name = notifications_mako
    match:namespace = ^(notifications)$
    blur = on
    ignore_alpha = 0.4
}

# Dunst Notifications
layerrule {
    name = notifications_dunst
    match:namespace = ^(dunst)$
    blur = on
    ignore_alpha = 0.4
}

# ============================================================================
# STATUS BARS & PANELS
# ============================================================================

# HyprPanel
layerrule {
    name = panel_hyprpanel
    match:namespace = ^(hyprpanel|HyprPanel)$
    blur = on
    ignore_alpha = 0.15
    xray = off
}

# Waybar
layerrule {
    name = panel_waybar
    match:namespace = ^(waybar)$
    blur = on
    ignore_alpha = 0.15
    xray = off
}

# Quickshell / Noctalia
layerrule {
    name = panel_quickshell
    match:namespace = ^(org\.quickshell)$
    blur = on
    ignore_alpha = 0.15
    xray = off
}

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}

# AGS (Aylur's Gtk Shell)
layerrule {
    name = panel_ags
    match:namespace = ^(ags|Ags)$
    blur = on
    ignore_alpha = 0.15
    xray = off
}

# EWW (ElKowars wacky widgets)
layerrule {
    name = panel_eww
    match:namespace = ^(eww)$
    blur = on
    ignore_alpha = 0.15
    xray = off
}

# ============================================================================
# LOGOUT & POWER MANAGEMENT
# ============================================================================

# WLogout
layerrule {
    name = logout_wlogout
    match:namespace = ^(logout_dialog|wlogout)$
    blur = on
    ignore_alpha = 0.3
    xray = on
    dim_around = on
}

# PowerMenu
layerrule {
    name = logout_powermenu
    match:namespace = ^(powermenu)$
    blur = on
    ignore_alpha = 0.3
    xray = on
    dim_around = on
}

# ============================================================================
# SYSTEM OVERLAYS (Lock Screen, OSD)
# ============================================================================

# Hyprlock (Lock Screen)
layerrule {
    name = overlay_hyprlock
    match:namespace = ^(hyprlock)$
    blur = on
    ignore_alpha = 0.3
}

# Swaylock
layerrule {
    name = overlay_swaylock
    match:namespace = ^(swaylock)$
    blur = on
    ignore_alpha = 0.3
}

# Avizo (OSD - Volume/Brightness)
layerrule {
    name = overlay_avizo
    match:namespace = ^(avizo|osd)$
    blur = on
    ignore_alpha = 0.25
}

# SwayOSD
layerrule {
    name = overlay_swayosd
    match:namespace = ^(swayosd)$
    blur = on
    ignore_alpha = 0.25
}

# Clipse (Clipboard Manager)
layerrule {
    name = overlay_clipse
    match:namespace = ^(clipse)$
    blur = on
    ignore_alpha = 0.4
}

# ============================================================================
# INPUT METHODS (IME / Virtual Keyboard)
# ============================================================================

# GTK Layer Shell
layerrule {
    name = input_gtk_layer_shell
    match:namespace = ^(gtk-layer-shell)$
    blur = on
    ignore_alpha = 0
}

# IBus
layerrule {
    name = input_ibus
    match:namespace = ^(ibus)$
    blur = on
    ignore_alpha = 0.2
}

# Fcitx5
layerrule {
    name = input_fcitx5
    match:namespace = ^(fcitx|fcitx5)$
    blur = on
    ignore_alpha = 0.2
}

# ============================================================================
# WALLPAPER LAYERS (No Blur)
# ============================================================================

# Hyprpaper
layerrule {
    name = wallpaper_hyprpaper
    match:namespace = ^(hyprpaper)$
    blur = off
}

# SWWW
layerrule {
    name = wallpaper_swww
    match:namespace = ^(swww)$
    blur = off
}

# Wpaperd
layerrule {
    name = wallpaper_wpaperd
    match:namespace = ^(wpaperd)$
    blur = off
}

# ============================================================================
# SCREEN SHARING INDICATORS
# ============================================================================

layerrule {
    name = screenshare_indicator
    match:namespace = ^(screensharing|xdg-desktop-portal)$
    blur = on
    ignore_alpha = 0.2
    above_lock = 1
}

# ============================================================================
# UTILITY TOOLS (Performance Optimized - No Animation)
# ============================================================================

# Selection Tools (Slurp, etc.)
layerrule {
    name = utility_selection
    match:namespace = ^(selection|slurp)$
    no_anim = on
}

# Color Picker (Hyprpicker)
layerrule {
    name = utility_hyprpicker
    match:namespace = ^(hyprpicker)$
    no_anim = on
}

# Screenshot Tools (Grim, etc.)
layerrule {
    name = utility_screenshot
    match:namespace = ^(grim|grimshot)$
    no_anim = on
}

# ============================================================================
# DOCK / TASKBAR (If Used)
# ============================================================================

# Plank
layerrule {
    name = dock_plank
    match:namespace = ^(plank)$
    blur = on
    ignore_alpha = 0.15
    xray = off
}

# ============================================================================
# CUSTOM OVERLAYS
# ============================================================================

# Custom Widget Overlays
layerrule {
    name = custom_widgets
    match:namespace = ^(widget)$
    blur = on
    ignore_alpha = 0.3
}

# Info Overlays
layerrule {
    name = custom_info
    match:namespace = ^(info)$
    blur = on
    ignore_alpha = 0.3
}
