# ~/.config/hypr/conf.d/input.conf
# Input configuration

input {
    # Keyboard
    kb_layout = us

    # Optimized repeat rates
    repeat_rate = 50
    repeat_delay = 250

    numlock_by_default = false
    resolve_binds_by_sym = false


    # Mouse
    sensitivity = 0.9 # Sensitivity (0 = no modification, -1.0 to 1.0)
    accel_profile = adaptive # or flat
    force_no_accel = false

    left_handed = false
    scroll_factor = 1.0
    natural_scroll = false

    # Focus behavior (Mac-like)
    follow_mouse = 1
    follow_mouse_threshold = 0.0
    focus_on_close = 1
    mouse_refocus = true
    float_switch_override_focus = 2

    special_fallthrough = false
    off_window_axis_events = 2
    emulate_discrete_scroll = 1

    # Touchpad
    touchpad {
        disable_while_typing = true
        natural_scroll = true
        scroll_factor = 1.0 # Scroll factor (1.0 = normal, >1.0 = faster)
        middle_button_emulation = false # Middle button emulation (3-finger tap)

        # Tap-to-click (modern laptop UX)
        tap-to-click = true
        tap-and-drag = true
        drag_lock = 0

        tap_button_map = lrm

        # Clickfinger behavior (macOS-like)
        # false = area-based clicking
        # true = finger count determines button (1=left, 2=right, 3=middle)
        clickfinger_behavior = true
    }
}
