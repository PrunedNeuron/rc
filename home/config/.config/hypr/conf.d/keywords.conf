# ~/.config/hypr/conf.d/keywords.conf
# Application keywords

# ==========================================
# TERMINAL EMULATOR
# ==========================================
$terminal = kitty
$terminalAlt = konsole

# ==========================================
# FILE MANAGER
# ==========================================
$fileManager = dolphin

# ==========================================
# APPLICATION LAUNCHERS
# ==========================================
$menu = vicinae toggle
$menuAlt = fuzzel --show-actions

# ==========================================
# WEB BROWSER
# ==========================================
$browser = firefox
$browserAlt = helium-browser

# ==========================================
# TEXT EDITOR / IDE
# ==========================================
$editor = code
$editorAlt = zeditor

# ==========================================
# NOTES APPLICATION
# ==========================================
# $notes = obsidian --enable-features=UseOzonePlatform --ozone-platform=wayland
$notes = kate
$notesAlt = kwrite

# ==========================================
# PASSWORD MANAGER
# ==========================================
# 1Password with Wayland support
$passwordManager = 1password

# ==========================================
# UTILITY TOOLS
# ==========================================
# hyprpicker - Native Hyprland color picker
$colorPicker = hyprpicker -a

# jome - Modern emoji picker with fuzzy search
$emojiPicker = jome | wl-copy

# qalculate - Advanced calculator
$calculator = qalculate-gtk

# ==========================================
# SCREENSHOT TOOLS
# ==========================================
$screenshot = grimblast
$screenshotRegion = hyprshot -m region

# ==========================================
# NOTIFICATION CENTER
# ==========================================
$notificationCenter = swaync-client -t -sw
