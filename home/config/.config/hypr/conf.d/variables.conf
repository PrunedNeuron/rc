# ~/.config/hypr/conf.d/variables.conf
# Refer to: https://wiki.hypr.land/Configuring/Variables/

#####################
### LOOK & FEEL   ###
#####################

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    # Gaps & Borders
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # Modern gradient border
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    # col.active_border = rgba(ff2a2aff) rgba(8b0000ff) rgba(8b0000ff) rgba(ff2a2aff) 45deg
    # col.inactive_border = rgba(00000000) # Transparent inactive borders
    # Greyish
    # col.active_border = rgba(5E81ACff) rgba(88C0D0ff) 45deg
    # col.inactive_border = rgba(3B4252aa)
    col.nogroup_border = rgba(BF616Aaa)
    col.nogroup_border_active = rgba(BF616Aff)

    # Layout
    layout = dwindle
    no_focus_fallback = false

    # Resizing
    resize_on_border = true
    extend_border_grab_area = 20
    hover_icon_on_border = true

    # Tearing (VRR) - Allowed for low latency gaming (G-SYNC/VRR support for RTX 3050)
    allow_tearing = true

    resize_corner = 0
    modal_parent_blocking = true

    # Snap Configuration (Nested as per v0.53 docs)
    snap {
        enabled = true
        window_gap = 12
        monitor_gap = 12
        border_overlap = false
        respect_gaps = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 2.5

    # Opacity
    active_opacity = 0.98
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    # Dimming
    dim_modal = true   # Dims background when modal dialogs appear
    dim_inactive = false
    dim_strength = 0.5
    dim_special = 0.25
    dim_around = 0.4

    # Shadow
    shadow {
        enabled = true
        range = 30
        render_power = 3
        sharp = false
        ignore_window = true
        color = rgba(00000066)
        offset = 0 8
        scale = 1.0
    }

    # Blur
    blur {
        enabled = true
        size = 6
        passes = 2

        # Optimization
        ignore_opacity = true
        new_optimizations = true
        xray = true     # Critical for performance on Hybrid GPU

        # Vibrancy / Noise
        noise = 0.03
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.25
        vibrancy_darkness = 0.15

        # Specific Blur Targets
        special = true       # Blurs background of special workspace
        popups = true
        popups_ignorealpha = 0#0.25
        input_methods = true # Blurs fcitx5/IME popups
        input_methods_ignorealpha = 0.25
    }

}


# https://wiki.hypr.land/Configuring/Variables/#animations

animations {
    enabled = true

    # Physics-based spring simulation curves
    # Golden spring: φ-ratio damping (ζ ≈ 0.618) for aesthetic optimum
    bezier = goldenSpring, 0.236, 1.236, 0.618, 1.0
    # Critical exit: Overdamped departure (ζ ≈ 1.2)
    bezier = criticalExit, 0.6, 0.04, 0.98, 0.335
    # Natural oscillator: Underdamped (ζ ≈ 0.5) for playful interactions
    bezier = naturalOscillator, 0.175, 0.885, 0.32, 1.275
    # Harmonic flow: Approximates simple harmonic motion
    bezier = harmonicFlow, 0.42, 0, 0.58, 1
    # Resonant peak: Maximum energy transfer point
    bezier = resonantPeak, 0.34, 1.56, 0.64, 1
    # Linear
    bezier = linear, 0, 0, 1, 1

    # Window animations - golden ratio timing (φ ≈ 1.618)
    animation = windowsIn, 1, 2.618, goldenSpring, popin 93%     # φ² × 100ms = 38 frames
    animation = windowsOut, 1, 2.236, criticalExit, popin 96%    # √5 × 100ms = 32 frames
    animation = windowsMove, 1, 2.427, goldenSpring, slide       # φ^1.5 × 100ms = 35 frames

    # Fade animations - harmonic series timing
    animation = fadeIn, 1, 1.732, harmonicFlow     # √3 × 100ms = 25 frames
    animation = fadeOut, 1, 1.414, criticalExit    # √2 × 100ms = 20 frames
    animation = fadeSwitch, 1, 2.0, harmonicFlow   # 2 × 100ms = 29 frames
    animation = fadeShadow, 1, 2.236, goldenSpring # √5 × 100ms = 32 frames
    animation = fadeDim, 1, 2.828, harmonicFlow    # 2√2 × 100ms = 41 frames
    animation = fadeLayers, 1, 1.732, harmonicFlow
    animation = fadeLayersIn, 1, 1.732, goldenSpring
    animation = fadeLayersOut, 1, 1.414, criticalExit
    animation = fadePopups, 1, 1.618, goldenSpring # φ × 100ms = 23 frames
    animation = fadePopupsIn, 1, 1.618, naturalOscillator
    animation = fadePopupsOut, 1, 1.272, criticalExit # √φ × 100ms = 18 frames

    # Border animations
    animation = border, 1, 7.854, harmonicFlow     # 5φ/2 × 100ms ≈ π×2.5
    animation = borderangle, 1, 300, linear, loop

    # Workspace animations - resonant frequency optimization
    animation = workspaces, 1, 3.142, goldenSpring, slide                # π × 100ms = 45 frames
    animation = workspacesIn, 1, 3.142, goldenSpring, slide
    animation = workspacesOut, 1, 2.618, criticalExit, slide             # φ² × 100ms
    animation = specialWorkspace, 1, 2.828, naturalOscillator, slidevert # 2√2 × 100ms
    animation = specialWorkspaceIn, 1, 2.828, resonantPeak, slidevert
    animation = specialWorkspaceOut, 1, 2.236, criticalExit, slidevert   # √5 × 100ms

    # Layer animations
    animation = layersIn, 1, 2.236, naturalOscillator, popin  # √5 × 100ms
    animation = layersOut, 1, 1.618, criticalExit, fade       # φ × 100ms
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
#####################
### GESTURES      ###
#####################

gestures {
    workspace_swipe_distance = 350
    workspace_swipe_touch = false
    workspace_swipe_invert = true
    workspace_swipe_touch_invert = false
    workspace_swipe_min_speed_to_force = 25
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 8
    workspace_swipe_forever = false
    workspace_swipe_use_r = false
    close_max_timeout = 1000
}

# https://wiki.hypr.land/Configuring/Variables/#group
#####################
### GROUP         ###
#####################

group {
    auto_group = true
    insert_after_current = true
    focus_removed_window = true
    drag_into_group = 1
    merge_groups_on_drag = true
    merge_groups_on_groupbar = true
    merge_floated_into_tiled_on_groupbar = false
    group_on_movetoworkspace = false

    # Group border colors
    col.border_active = rgba(88C0D0ff)
    col.border_inactive = rgba(4C566Aaa)
    col.border_locked_active = rgba(D08770ff)
    col.border_locked_inactive = rgba(5E81ACaa)

    groupbar {
        enabled = true
        font_size = 9
        font_weight_active = semibold
        font_weight_inactive = normal
        gradients = true
        height = 16
        indicator_gap = 2
        indicator_height = 3
        stacked = false
        priority = 3
        render_titles = true
        scrolling = true
        rounding = 8
        rounding_power = 2.5
        text_color = rgba(ECEFF4ff)
        col.active = rgba(5E81ACcc)
        col.inactive = rgba(3B4252aa)
        col.locked_active = rgba(D08770cc)
        col.locked_inactive = rgba(4C566Aaa)
        blur = true
    }
}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false

    split_width_multiplier = 1.0
    use_active_for_splits = true
    default_split_ratio = 1.0
    split_bias = 0

    force_split = 2 # Always split to the right/bottom
}

# https://wiki.hypr.land/Configuring/Master-Layout/
master {
    new_status = master
    new_on_top = false
    mfact = 0.55
    orientation = left

    smart_resizing = true
    drop_at_cursor = true
}


# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    # Brand
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_scale_notification = false
    font_family = SF Pro Display
    force_default_wallpaper = 0 # Disable anime wallpaper

    # Fonts
    font_family = Sans

    # Screen & Refresh
    vrr = 2    # 1 = On (Adaptive Sync), 2 = Fullscreen only
    vfr = true # Variable Frame Rate (Saves Battery)
    render_unfocused_fps = 15

    # DPMS
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    # Behavior
    always_follow_on_dnd = true
    layers_hog_keyboard_focus = true
    disable_autoreload = false

    # Animations
    animate_manual_resizes = true
    animate_mouse_windowdragging = true

    # Focus
    focus_on_activate = false
    mouse_move_focuses_monitor = true

    # Window swallowing
    enable_swallow = true
    swallow_regex = ^(kitty|konsole|alacritty)$
    swallow_exception_regex = ^(wev|nmtui)$

    # Session
    allow_session_lock_restore = true
    session_lock_xray = false
    background_color = rgba(2E3440ff)

    close_special_on_empty = true
    on_focus_under_fullscreen = 2 # 2 = Unfullscreen when opening launchers
    exit_window_retains_fullscreen = false
    initial_workspace_tracking = 0
    middle_click_paste = false

    # App not responding dialog
    enable_anr_dialog = true
    anr_missed_pings = 5

    size_limits_tiled = false
    disable_watchdog_warning = false
}

# https://wiki.hypr.land/Configuring/Variables/#render
render {
    direct_scanout = 0  # 0 = off, 1 = on, 2 = Auto (on with content type 'game')
    expand_undersized_textures = true
    xp_mode = false

    # Color Management (Optional, keeping defaults mostly)
    cm_enabled = true
    ctm_animation = 2  # Auto (disabled on Nvidia)
    cm_fs_passthrough = 2  # HDR only
    send_content_type = true
    cm_auto_hdr = 1  # Switch to cm, hdr
    non_shader_cm = 3  # Disable and ignore CM issues
    cm_sdr_eotf = 0  # Default (gamma22)

    # Auto use Triple Buffering
    new_render_scheduling = false


}


# https://wiki.hypr.land/Configuring/Variables/#cursor
#####################
### CURSOR        ###
#####################

cursor {
    invisible = false
    sync_gsettings_theme = true
    no_hardware_cursors = 2  # Auto (disable when tearing)
    no_break_fs_vrr = 2  # Auto (on with content type 'game')
    min_refresh_rate = 60
    hotspot_padding = 1
    inactive_timeout = 0
    no_warps = false
    persistent_warps = true
    warp_on_change_workspace = 0
    warp_on_toggle_special = 0
    zoom_factor = 1.0
    zoom_rigid = false
    zoom_detached_camera = false
    enable_hyprcursor = true
    hide_on_key_press = false
    hide_on_touch = true
    hide_on_tablet = true
    use_cpu_buffer = 2  # Auto (nvidia only)
    warp_back_after_non_mouse_input = false
    zoom_disable_aa = false
}

#####################
### BINDS         ###
#####################

binds {
    pass_mouse_when_bound = false
    scroll_event_delay = 0
    workspace_back_and_forth = true
    hide_special_on_workspace_change = false
    allow_workspace_cycles = true
    workspace_center_on = 0
    focus_preferred_method = 0
    ignore_group_lock = false
    movefocus_cycles_fullscreen = false
    movefocus_cycles_groupfirst = false
    disable_keybind_grabbing = false
    window_direction_monitor_fallback = true
    allow_pin_fullscreen = false
    drag_threshold = 1
}


# https://wiki.hypr.land/Configuring/Variables/#xwayland
#####################
### XWAYLAND      ###
#####################

xwayland {
    enabled = true
    use_nearest_neighbor = true
    force_zero_scaling = true
}

# https://wiki.hypr.land/Configuring/Variables/#opengl
#####################
### OPENGL        ###
#####################

opengl {
    nvidia_anti_flicker = true
}


# https://wiki.hypr.land/Configuring/Variables/#debug
#####################
### DEBUG         ###
#####################

debug {
    overlay = false
    damage_blink = false
    disable_logs = false
    disable_time = true
    damage_tracking = 2  # Full
    enable_stdout_logs  = true
    manual_crash = 0
    suppress_errors = false
    disable_scale_checks = false
    error_limit = 5
    error_position = 0
    colored_stdout_logs = true
}
