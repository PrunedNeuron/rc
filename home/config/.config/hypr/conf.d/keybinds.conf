# ~/.config/hypr/conf.d/keybinds.conf

$mainMod = SUPER
$shiftMod = SUPER_SHIFT
$ctrlMod = SUPER_CTRL
$altMod = SUPER_ALT


############
# APPLICATION LAUNCHERS
############

bindd = $mainMod, T, Launch Terminal, exec, $terminal
bindd = $shiftMod, T, Launch Terminal, exec, $terminalAlt
bindd = $mainMod, B, Launch Browser, exec, $browser
bindd = $shiftMod, B, Launch Browser (alt), exec, $browserAlt
bindd = $mainMod, O, Open Notes, exec, $notes
bindd = $shiftMod, O, Open Notes (alt), exec, $notesAlt
bindd = $mainMod, C, Open Code Editor, exec, $editor
bindd = $shiftMod, C, Open Code Editor (alt), exec, $editorAlt
bindd = $mainMod, F, Open File Manager, exec, $fileManager

# Menu Launchers
; bindd = $mainMod, D, Application Menu, exec, $menu
bindd = $mainMod, Space, Application Menu, exec, $menu
bindd = $shiftMod, Space, Secondary Menu, exec, $menuAlt

# Password Manager
bindd = $mainMod, P, Password Manager, exec, $passwordManager

############
# WINDOW MANAGEMENT
############

bindd = $mainMod, Q, Close Active Window, killactive
bindd = $shiftMod, Q, Force Kill, exec, hyprctl kill
bindd = $shiftMod, M, Exit Session, exec, uwsm stop || hyprctl dispatch exit

# Toggle window states
bindd = $mainMod, W, Toggle Floating, togglefloating
bindd = $mainMod, G, Toggle Group, togglegroup
bindd = $mainMod, J, Toggle Split, togglesplit
bindd = $mainMod, Z, Fullscreen 0, fullscreen, 0
bindd = $mainMod, M, Fullscreen 1, fullscreen, 1
bindd = $mainMod, Y, Pin Window, pin

# FOCUS MOVEMENT (FIXED: Removed 'i' flag which was blocking terminal keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $shiftMod, left, movewindow, l
bind = $shiftMod, right, movewindow, r
bind = $shiftMod, up, movewindow, u
bind = $shiftMod, down, movewindow, d

# Resize windows (Repeatable)
binde = $ctrlMod, right, resizeactive, 30 0
binde = $ctrlMod, left, resizeactive, -30 0
binde = $ctrlMod, up, resizeactive, 0 -30
binde = $ctrlMod, down, resizeactive, 0 30

bind = $mainMod, X, centerwindow

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse:274, togglefloating

############
# WORKSPACE MANAGEMENT
############

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $shiftMod, 1, movetoworkspace, 1
bind = $shiftMod, 2, movetoworkspace, 2
bind = $shiftMod, 3, movetoworkspace, 3
bind = $shiftMod, 4, movetoworkspace, 4
bind = $shiftMod, 5, movetoworkspace, 5
bind = $shiftMod, 6, movetoworkspace, 6
bind = $shiftMod, 7, movetoworkspace, 7
bind = $shiftMod, 8, movetoworkspace, 8
bind = $shiftMod, 9, movetoworkspace, 9
bind = $shiftMod, 0, movetoworkspace, 10

bind = $ctrlMod, 1, movetoworkspacesilent, 1
bind = $ctrlMod, 2, movetoworkspacesilent, 2
bind = $ctrlMod, 3, movetoworkspacesilent, 3
bind = $ctrlMod, 4, movetoworkspacesilent, 4
bind = $ctrlMod, 5, movetoworkspacesilent, 5
bind = $ctrlMod, 6, movetoworkspacesilent, 6
bind = $ctrlMod, 7, movetoworkspacesilent, 7
bind = $ctrlMod, 8, movetoworkspacesilent, 8
bind = $ctrlMod, 9, movetoworkspacesilent, 9
bind = $ctrlMod, 0, movetoworkspacesilent, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, BracketRight, workspace, e+1
bind = $mainMod, BracketLeft, workspace, e-1

############
# CLIPBOARD & TOOLS
############

# bind = $mainMod, V, exec, kitty --class floating --config ~/.config/kitty/floating.conf -e clipse
bind = $mainMod, V, exec, vicinae vicinae://extensions/vicinae/clipboard/history

bind = $mainMod, period, exec, $emojiPicker
bind = $mainMod, I, exec, $colorPicker
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, equal, exec, $calculator

############
# SYSTEM & SESSION
############

bindl = $mainMod, L, exec, hyprlock
bindl = $mainMod, Escape, exec, wlogout
bindl = $ctrlMod, Escape, exec, systemctl suspend
# bind = CTRL, Escape, exec, hyprpanel -q || hyprpanel
bind = CTRL, Escape, exec, qs -c noctalia-shell kill || qs -c noctalia-shell

############
# SCREENSHOTS (FLAMESHOT)
############

bind = $shiftMod, S, exec, XDG_CURRENT_DESKTOP=sway flameshot gui
bind = , Print, exec, grimblast --notify copysave screen
bind = SUPER, Print, exec, grimblast --notify copysave active

############
# AUDIO & MEDIA CONTROL
############

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

############
# BRIGHTNESS CONTROL
############

bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

############
# RESIZE SUBMAP
############

bind = $mainMod, R, submap, resize

submap = resize
    bind = , catchall, submap, reset
    binde = , right, resizeactive, 10 0
    binde = , left, resizeactive, -10 0
    binde = , up, resizeactive, 0 -10
    binde = , down, resizeactive, 0 10
    bind = , escape, submap, reset
    bind = , Return, submap, reset
submap = reset

############
# PASSTHROUGH MODE
############

bind = $mainMod, Pause, submap, passthrough

submap = passthrough
    bindu = $mainMod, Pause, submap, reset
submap = reset

# ==========================================
# PLUGIN DISPATCHERS
# ==========================================

# Launch Hyprspace (Window Overview)
# Similar to GNOME or macOS Mission Control
# bindd = $mainMod, Tab, Window Overview, overview:toggle

# Launch Hyprexpo (Workspace Grid)
# Best for moving between 10+ workspaces
bindd = $mainMod, Grave, Workspace Grid, hyprexpo:expo, toggle


##### SWALLOW / SPECIAL
# Swallow: when one program opens another and it takes over the view
bind = $mainMod, S, toggleswallow

# Special
bind = $mainMod, Tab, togglespecialworkspace
bind = $shiftMod, Tab, movetoworkspace, special

############
# GESTURES
############

# 4-Finger Swipe UP -> Window Overview (Hyprspace)
# gesture = 4, up, dispatcher, overview:toggle

# 3-Finger Swipe DOWN -> Workspace Grid (Hyprexpo)
# gesture = 3, down, dispatcher, hyprexpo:expo, toggle
gesture = 4, pinchin, dispatcher, hyprexpo:expo, off
gesture = 4, pinchout, dispatcher, hyprexpo:expo, on

gesture = 3, horizontal, workspace
