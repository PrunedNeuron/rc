# ~/.config/hypr/hyprpaper.conf
# See: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

# Preload images
preload = ~/Pictures/wallpapers/night_car_vintage.jpg

# Apply wallpaper to all monitors
# FIXED: Using the new block syntax to resolve the "no target" error
wallpaper {
    # Leaving monitor empty acts as a fallback for all monitors (e.g., eDP-1)
    monitor =
    path = ~/Pictures/wallpapers/night_car_vintage.jpg

    # Optional: default is cover; options: contain, cover, fill, tile
    fit_mode = cover
}

# Disable splash screen
splash = false
