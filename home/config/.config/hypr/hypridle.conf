# ~/.config/hypr/hypridle.conf

general {
    # Lock command
    lock_cmd = pidof hyprlock || hyprlock

    # Before sleep commands
    before_sleep_cmd = loginctl lock-session
    before_sleep_cmd = hyprctl dispatch dpms off

    # After sleep commands
    after_sleep_cmd = hyprctl dispatch dpms on

    # DBus inhibit handling
    ignore_dbus_inhibit = false

    # System inhibit (prevent suspend when running)
    ignore_systemd_inhibit = false
}

# ==========================================
# STAGE 1: DIM SCREEN (60 seconds)
# ==========================================
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 5%
    on-resume = brightnessctl -r
}

# ==========================================
# STAGE 2: LOCK SCREEN (90 seconds)
# ==========================================
listener {
    timeout = 90
    on-timeout = loginctl lock-session
}

# ==========================================
# STAGE 3: DISPLAY OFF (2 minutes)
# ==========================================
listener {
    timeout = 120
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ==========================================
# STAGE 4: SUSPEND SYSTEM (5 minutes)
# ==========================================
listener {
    timeout = 300
    on-timeout = systemctl suspend
}
