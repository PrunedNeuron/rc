# ─── Structural ───────────────────────────────────────────────────────────────

[fill]
symbol = ' '

[character]
format                    = "$symbol "
# success_symbol            = "[➜](bold green)"
# error_symbol              = "[➜](bold red)"
success_symbol            = "[](bold green)"
error_symbol              = "[](bold red)"
# Plain letters — zero ambiguity vs. box-drawing substitutes
vimcmd_symbol             = "[](bold italic dimmed green)"
vimcmd_replace_one_symbol = "r"
vimcmd_replace_symbol     = "R"
vimcmd_visual_symbol      = "v"

[cmd_duration]
min_time = 2_000   # suppress sub-2 s noise; only useful when noticeably slow
format   = "[󱎫 $duration](bold white) "
show_notifications = true
show_milliseconds = true

[jobs]
format = "[$symbol$number]($style) "
symbol = "⚙️ "
style  = "bold white"

# ─── Identity ─────────────────────────────────────────────────────────────────

[username]
format      = "[👤 $user]($style) "
style_user  = "bold yellow"
style_root  = "bold red"
show_always = false
disabled    = false

[hostname]
ssh_only = true
format   = "[@$hostname](bold dimmed white) "
disabled = false

[localip]
ssh_only = true
format   = "[📡 $localipv4](bold magenta) "
disabled = false

[sudo]
format   = "[$symbol]($style)"
style    = "bold bright-purple"
symbol   = "🔐 "
disabled = false

[env_var.VIMSHELL]
format = "[$env_value]($style) "
style  = "italic green"

[status]
symbol = "🔴 "
sigint_symbol = "❗"
format = '[\[$symbol$common_meaning$signal_name$maybe_int\]]($style) '
map_symbol = true
disabled = false

# ─── Navigation ───────────────────────────────────────────────────────────────

[directory]
home_symbol       = "~"
truncation_length = 16
truncation_symbol = ".../"
read_only         = " 🔒"
style             = "bold blue"
format            = "[$path]($style) [$read_only]($read_only_style) "
repo_root_style   = 'bold cyan'
# NerdFont branch icon (U+E0A0) signals "you are inside a repo"
repo_root_format  = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [](bold bright-blue) "

# ─── Version Control ──────────────────────────────────────────────────────────

[git_branch]
# NerdFont  U+E0A0 — powerline git-branch glyph, universally available
format            = " [ $branch(:$remote_branch)]($style)"
style             = "bold cyan"
truncation_symbol = "…"
truncation_length = 20
ignore_branches   = ["main", "master"]
only_attached     = true

[git_commit]
# Detached HEAD only — hash is only semantically useful then
format             = " [ $hash$tag]($style)"
style              = "dimmed white"
commit_hash_length = 7
only_detached      = true

[git_state]
format = " [$state( $progress_current/$progress_total)]($style)"
style  = "bold yellow"

[git_status]
style      = "bold italic cyan"
format     = "([  $ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed ]($style))"
conflicted = "⚡"
ahead      = "[↑${count}](green)"
behind     = "[↓${count}](red)"
diverged   = "[↕ ↑${ahead_count}↓${behind_count}](bright-magenta)"
untracked  = "[?](yellow)"
stashed    = "[≡](dimmed white)"
modified   = "[!](yellow)"
staged     = "[+${count}](bright-cyan)"
renamed    = "[»](bright-blue)"
deleted    = "[✗](red)"

# git_metrics runs `git diff --stat` each render (~20–80 ms in large repos).
# Disable this first if the prompt ever feels sluggish.
[git_metrics]
format            = '([+$added]($added_style))([-$deleted]($deleted_style)) '
added_style       = 'italic dimmed green'
deleted_style     = 'italic dimmed red'
ignore_submodules = true
disabled          = false

# ─── System ───────────────────────────────────────────────────────────────────

[time]
disabled        = false
format          = "[󰥔 $time]($style)"
time_format     = "%H:%M"
utc_time_offset = "local"
style           = "bold white"

[battery]
format             = "[$symbol $percentage]($style) "
# full_symbol        = "󰁹 "
charging_symbol    = "󰂄 "
# discharging_symbol = "💀"


[[battery.display]]
threshold = 20
style     = "bold red"
discharging_symbol = "󰁻 "

[[battery.display]]
threshold = 60
style     = "bold bright-purple"
discharging_symbol = "󰁿 "

[[battery.display]]
threshold = 70
style     = "bold yellow"
discharging_symbol = "󰂀 "

# Queries /proc/meminfo every render — disabled by default, enable if wanted
[memory_usage]
symbol   = "󰍛 "
format   = "[$symbol${ram}( ${swap})]($style) "
disabled = true

[aws]
disabled = true

# ─── Toolchain ────────────────────────────────────────────────────────────────
# Config blocks only exist where defaults are meaningfully overridden.
# All other language modules (erlang, kotlin, scala, terraform, etc.) will
# render via starship's built-in defaults — no config block needed.

[package]
format = " [📦 $version]($style)"
style  = "bold dimmed yellow"

[docker_context]
format = " [🐳 $context]($style)"
style  = "bold blue"

[python]
symbol         = " "
format         = " [$symbol$version]($style)"
version_format = "${raw}"
style          = "bold yellow"

[rust]
symbol         = " "
format         = " [$symbol$version]($style)"
version_format = "${raw}"
style          = "bold red"

[golang]
symbol         = " "
format         = " [$symbol$version]($style)"
version_format = "${raw}"
style          = "bold cyan"

[nodejs]
symbol            = " "
format            = " [$symbol$version]($style)"
version_format    = "${raw}"
style             = "bold green"
# Lockfile-only detection prevents false positives in any dir containing .js
detect_extensions = []
detect_files      = ["package-lock.json", "yarn.lock", "pnpm-lock.yaml"]
detect_folders    = ["node_modules"]

[lua]
symbol         = "󰢱 "
format         = " [$symbol$version]($style)"
version_format = "${raw}"
style          = "bold blue"

[java]
symbol         = "☕ "
format         = " [$symbol$version]($style)"
version_format = "${raw}"

[ruby]
symbol         = " "
format         = " [$symbol$version]($style)"
version_format = "${raw}"
style          = "bold red"

[swift]
symbol         = "󰛥 "
format         = " [$symbol$version]($style)"
version_format = "${raw}"
style          = "bold bright-red"

# NerdFont  C/C++ icons (nf-custom-c / nf-custom-cpp, Nerd Fonts v3)
[c]
symbol = " "
format = " [$symbol($version(-$name))]($style)"

[cpp]
# symbol = "󰙲 "
symbol = " "
format = " [$symbol($version(-$name))]($style)"

[cmake]
symbol = ""

[haskell]
symbol = " "
format = " [$symbol$version]($style)"

[deno]
symbol         = "🦕 "
format         = " [$symbol$version]($style)"
version_format = "${raw}"

[julia]
symbol = " "
format = " [$symbol$version]($style)"

[nim]
symbol = " "
format = " [$symbol$version]($style)"

[zig]
symbol = " "
format = " [$symbol$version]($style)"

[elixir]
symbol = "💧 "
format = " [$symbol$version OTP $otp_version]($style)"

[conda]
format = " [🅒 $environment]($style)"

[pixi]
format = " [🟩 $version ($environment)]($style)"
